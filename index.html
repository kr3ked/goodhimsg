<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Messenger</title>
<style>
:root{--bg:#fff;--bg2:#f4f4f5;--tx:#18181b;--mu:#71717a;--ac:#3390ec;--in:#fff;--out:#e3f2ff;--bd:#e4e4e7}
:root[data-theme=dark]{--bg:#18181b;--bg2:#27272a;--tx:#fafafa;--mu:#a1a1aa;--ac:#8774e1;--in:#2b2b30;--out:#4b4380;--bd:#3f3f46}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px system-ui,sans-serif;background:var(--bg);color:var(--tx)}
button,input,select,textarea{font:inherit;color:inherit}
input,select{background:var(--bg2);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;width:100%}
button{cursor:pointer;border:0;background:none}
.btn{background:var(--ac);color:#fff;border-radius:10px;padding:10px 14px;width:100%}
.hide{display:none!important}
#auth{max-width:340px;margin:12vh auto;padding:20px;display:grid;gap:10px}
#app{display:grid;grid-template-columns:340px 1fr;height:100%}
#side{border-right:1px solid var(--bd);display:flex;flex-direction:column;min-height:0}
.top{display:flex;gap:8px;padding:10px;align-items:center}
#list{overflow:auto;flex:1}
.row{display:flex;gap:10px;padding:10px 12px;cursor:pointer;align-items:center}
.row:hover,.row.on{background:var(--bg2)}
.av{width:44px;height:44px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-weight:600;flex:none;position:relative}
.av.on::after{content:"";position:absolute;right:0;bottom:0;width:11px;height:11px;border-radius:50%;background:#22c55e;border:2px solid var(--bg)}
.grow{flex:1;min-width:0}.nm{display:flex;justify-content:space-between;gap:6px;font-weight:600}
.sub{display:flex;justify-content:space-between;gap:6px;color:var(--mu);font-size:13px}
.sub span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{background:var(--ac);color:#fff;border-radius:10px;padding:0 7px;font-size:12px}
.sec{padding:6px 12px;color:var(--mu);font-size:12px}
#main{display:flex;flex-direction:column;min-height:0}
#head{display:flex;gap:10px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--bd)}
#msgs{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:var(--bg2)}
.m{max-width:min(75%,520px);padding:6px 10px;border-radius:14px;background:var(--in);position:relative;word-wrap:break-word;white-space:pre-wrap}
.m.me{align-self:flex-end;background:var(--out)}
.rp{border-left:3px solid var(--ac);padding-left:6px;margin-bottom:3px;font-size:13px;color:var(--mu)}
.meta{font-size:11px;color:var(--mu);text-align:right}.meta .ok{color:var(--ac)}
.acts{display:none;position:absolute;top:-14px;right:6px;background:var(--bg);border:1px solid var(--bd);border-radius:8px}
.m:hover .acts{display:flex}.acts button{padding:2px 6px}
.del{font-style:italic;color:var(--mu)}
#bar{padding:4px 12px;font-size:13px;color:var(--mu);display:flex;justify-content:space-between}
#comp{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--bd)}
#comp input{flex:1}#comp button{width:auto}
#back{display:none}
.modal{position:fixed;inset:0;background:#0007;display:grid;place-items:center}
.modal>div{background:var(--bg);border-radius:14px;padding:18px;width:min(380px,92vw);display:grid;gap:10px}
.empty{margin:auto;color:var(--mu)}
@media(max-width:760px){#app{grid-template-columns:1fr}#main{display:none}#app.open #side{display:none}#app.open #main{display:flex}#back{display:block}}
</style>
</head>
<body>
<form id="auth">
  <h2 id="atitle" style="margin:0">Вход</h2>
  <input id="aname" class="hide" placeholder="Имя">
  <input id="auser" class="hide" placeholder="@username (латиница, цифры, _)">
  <input id="aemail" type="email" placeholder="Email" required>
  <input id="apass" type="password" placeholder="Пароль (мин. 6 символов)" required minlength="6">
  <button class="btn">Войти</button>
  <button type="button" id="aswitch" style="color:var(--ac)">Нет аккаунта? Регистрация</button>
  <div id="aerr" style="color:#ef4444"></div>
</form>
<div id="app" class="hide">
  <aside id="side">
    <div class="top"><input id="q" placeholder="Поиск: чаты и @username"><button id="me" class="av"></button></div>
    <div id="list"></div>
  </aside>
  <section id="main">
    <div id="head" class="hide"><button id="back">←</button><div id="hav" class="av"></div><div class="grow"><b id="hname"></b><div id="hst" class="sub"></div></div></div>
    <div id="msgs"><div class="empty">Выберите чат или найдите человека по @username</div></div>
    <div id="bar" class="hide"><span id="barx"></span><button id="barc">✕</button></div>
    <form id="comp" class="hide"><input id="txt" placeholder="Сообщение" autocomplete="off"><button class="btn">➤</button></form>
  </section>
</div>
<script type="module" src="app.js"></script>
</body>
</html>

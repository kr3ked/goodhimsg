<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap&subset=cyrillic">
<style>
:root{--bg:#ececf0;--card:#f6f6f9;--soft:#e4e6eb;--tx:#14171c;--mut:#667085;--ind:#2563eb;--vio:#1d4ed8;--ok:#10b981;--line:#d6d9e0;--in:#fff;--g1:#3b82f6;--g2:#2563eb;--glow:rgba(255,255,255,.75);--dot:rgba(20,23,28,.09);color-scheme:light}
:root[data-theme=dark]{--bg:#0c0e12;--card:#13161c;--soft:#1a1e26;--tx:#e9ecf2;--mut:#7e8696;--ind:#5b9bff;--vio:#1d4ed8;--g1:#3b82f6;--g2:#2563eb;--line:#242831;--in:#1a1e27;--glow:rgba(255,255,255,.05);--dot:rgba(255,255,255,.08);color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:"Nunito","Segoe UI",system-ui,sans-serif;font-size:1rem;color:var(--tx);overflow:hidden;background-color:var(--bg);background-image:radial-gradient(120% 55% at 50% 0%,var(--glow),transparent 62%),radial-gradient(var(--dot) 1px,transparent 1.3px);background-size:100% 100%,24px 24px}
*{-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;transition:transform .18s cubic-bezier(.3,1.4,.5,1),background-color .25s,opacity .25s,color .25s,box-shadow .25s}
button:active:not(:disabled){transform:scale(.95)}
input{font:inherit;color:inherit;font-size:max(16px,1rem)}
#app{height:100dvh;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
.inp{width:100%;border:0;outline:0;background:var(--soft);border-radius:16px;padding:14px 16px}
.inp:focus{box-shadow:0 0 0 2px #60a5fa}
.pb{width:100%;padding:14px;border-radius:16px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 8px 22px rgba(30,58,138,.45)}
.pb:active,.sb:active{transform:scale(.98)}.sb{width:100%;padding:14px;border-radius:16px;font-weight:800;background:var(--soft)}
.err{color:#f43f5e;font-size:14px;text-align:center;margin-top:10px}
.av{flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800}
.av img{width:100%;height:100%;object-fit:cover}
/* auth */
.aurora{position:relative;height:100%;overflow:auto;display:grid;place-items:center;padding:20px;background:linear-gradient(125deg,#c7d2fe,#fbcfe8,#a7f3d0,#bae6fd,#ddd6fe,#c7d2fe);background-size:400% 400%;animation:sh 16s ease-in-out infinite}
[data-theme=dark] .aurora{background:linear-gradient(125deg,#030107,#1e0a40,#06020d,#0b1e4a,#030107,#260a3d,#030107);background-size:400% 400%}
@keyframes sh{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.b1{background:#f9a8d4}.b2{background:#7dd3fc}.b3{background:#6ee7b7}[data-theme=dark] .b1{background:#1e3a8a;opacity:.4}[data-theme=dark] .b2{background:#081433;opacity:.6}[data-theme=dark] .b3{background:#1e3a8a;opacity:.35}
.blob{position:fixed;border-radius:50%;filter:blur(64px);opacity:.55;pointer-events:none;animation:fl 20s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-50px) scale(1.15)}66%{transform:translate(-45px,35px) scale(.92)}}
.glass{position:relative;width:100%;max-width:380px;padding:30px 24px;border-radius:32px;background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(18px);box-shadow:0 24px 60px rgba(99,102,241,.18);color:#0f172a}
[data-theme=dark] .glass{background:rgba(7,3,15,.72);border-color:rgba(59,130,246,.22);color:#f1eaff;box-shadow:0 24px 60px rgba(30,58,138,.35)}

.glass h1{font-size:30px;font-weight:800;text-align:center}
.glass .sub{text-align:center;color:var(--mut);margin:8px 0 22px;font-size:15px}
.otp{display:flex;gap:7px;justify-content:center;margin:8px 0}
.otp input{width:44px;height:54px;text-align:center;font-size:24px;font-weight:800;background:var(--soft);border-radius:14px;border:0;outline:0}
.otp input:focus{box-shadow:0 0 0 2px var(--ind)}
.pop{animation:pop .4s cubic-bezier(.3,1.5,.5,1) both}@keyframes pop{from{opacity:0;transform:translateY(12px) scale(.95)}to{opacity:1;transform:none}}
/* main */
.main{height:100%;display:flex}
aside{width:390px;flex:none;display:flex;flex-direction:column}
.pane{flex:1;min-width:0;display:flex;flex-direction:column;border-left:1px solid var(--line)}
@media (max-width:760px){aside{width:100%}.pane{display:none}.main.open aside{display:none}.main.open .pane{display:flex;border:0}}
.top{display:flex;justify-content:space-between;align-items:center;padding:18px 18px 8px}
.top h1{font-size:28px;font-weight:800}
.ib{width:42px;height:42px;border-radius:50%;color:var(--ind);background:rgba(59,130,246,.12)}.ib:hover{background:var(--soft)}
.list{flex:1;overflow:auto;padding:4px 8px}
.row{width:100%;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;text-align:left}
.row:hover,.row.on{background:var(--soft)}.row:active{transform:scale(.985)!important}
.row .nm{font-weight:800}.row .sb2{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow{flex:1;min-width:0}
.badge{background:var(--ind);color:#fff;font-size:11px;font-weight:800;border-radius:99px;min-width:20px;height:20px;padding:0 6px;display:grid;place-items:center}
.nav{position:relative;display:flex;gap:4px;padding:8px 10px;border-top:1px solid var(--line)}
.nav .ind{position:absolute;top:8px;bottom:8px;left:10px;width:calc((100% - 20px - (var(--n) - 1)*4px)/var(--n));border-radius:16px;background:linear-gradient(135deg,rgba(59,130,246,.28),rgba(30,58,138,.3));box-shadow:0 0 22px rgba(59,130,246,.3),inset 0 0 0 1px rgba(96,165,250,.28);transform:translateX(calc(var(--i)*(100% + 4px)));transition:transform .5s cubic-bezier(.3,1.2,.4,1)}
.nav button{z-index:1}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px;border-radius:16px;font-size:11px;font-weight:800;color:var(--mut);position:relative;transition:.25s}
.nav button.on{color:var(--ind)}.nav button.on svg{filter:drop-shadow(0 0 6px rgba(96,165,250,.7))}.nav button span{font-size:22px}
.nav .badge{position:absolute;top:2px;right:22%}
.empty{height:100%;display:grid;place-items:center;text-align:center;color:var(--mut);padding:30px}
.empty b{display:block;font-size:20px;color:var(--tx);margin-bottom:6px}
.sec{padding:10px 14px 4px;font-size:12px;font-weight:800;color:var(--mut)}
.pill{padding:7px 13px;border-radius:12px;font-size:13px;font-weight:800;color:#fff;background:var(--ind)}.pill.ok{background:var(--soft);color:var(--mut)}
.req{display:flex;align-items:center;gap:10px;padding:10px 12px;margin:2px 0;border-radius:18px;background:rgba(59,130,246,.14)}
/* chat */
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.back{display:none}@media (max-width:760px){.back{display:block}}
.msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:14px;display:flex;flex-direction:column;gap:8px}
.m{font-size:1rem;max-width:80%;padding:8px 13px;border-radius:18px;line-height:1.3;white-space:pre-wrap;overflow-wrap:anywhere}.m.fresh{animation:pop .3s both}
.m.in{align-self:flex-start;background:var(--in);border-bottom-left-radius:6px}
.m.out{align-self:flex-end;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));border-bottom-right-radius:6px}
.m i{display:flex;justify-content:flex-end;align-items:center;gap:4px;font-style:normal;font-size:11px;opacity:.75;margin-top:2px}.tk{display:inline-flex;align-items:center;color:rgba(255,255,255,.65)}.tk svg{stroke-width:2.5}.tk.rd{color:#4ade80;filter:drop-shadow(0 0 4px rgba(74,222,128,.55))}
.comp{display:flex;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}
.comp .inp{border-radius:99px;padding:11px 18px}
.send{width:44px;height:44px;flex:none;border-radius:50%;color:#fff;background:linear-gradient(135deg,var(--g1),var(--g2));font-size:18px}
.thprev{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--bg);border:1px solid var(--line)}
.thprev .m{max-width:85%}
.cpk{width:30px;height:30px;border-radius:50%;overflow:hidden;position:relative;display:block;cursor:pointer;background:conic-gradient(#f43f5e,#f59e0b,#10b981,#0ea5e9,#6366f1,#d946ef,#f43f5e)}
.cpk input{position:absolute;inset:-8px;width:50px;height:50px;opacity:0;cursor:pointer;border:0;padding:0}
.sws button.none{background:var(--soft);color:var(--mut);font-size:15px;font-weight:800;display:grid;place-items:center}
/* sheet + toast */
.ov{position:fixed;inset:0;z-index:30;background:rgba(15,23,42,.5);backdrop-filter:blur(4px);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:761px){.ov{align-items:center}}
.sheet{width:100%;max-width:440px;max-height:92%;overflow:auto;background:var(--card);border-radius:28px 28px 0 0;padding:20px;position:relative}
@media (min-width:761px){.sheet{border-radius:28px}}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet h2{font-size:20px;font-weight:800;margin-bottom:14px;display:flex;justify-content:space-between}
.sheet .stack{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;z-index:50;top:calc(10px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:calc(100% - 20px);max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 18px 40px rgba(0,0,0,.55);animation:tin .35s both;cursor:pointer}@keyframes tin{from{opacity:0;transform:translate(-50%,-14px)}to{opacity:1;transform:translate(-50%,0)}}
.toast b{display:block;font-size:14px}.toast .big{font-size:26px;font-weight:800;letter-spacing:.2em;color:var(--ind)}.toast small{display:block;margin-top:2px;font-size:13px;line-height:1.3;color:var(--mut);white-space:normal;overflow-wrap:anywhere;max-height:5.2em;overflow:hidden}
.colors{display:flex;gap:8px;justify-content:center}.colors button{width:28px;height:28px;border-radius:50%}.colors .on{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ind)}
.ico{display:block}.ib,.send{display:grid;place-items:center}
.seg{display:grid;gap:4px;padding:4px;border-radius:16px;background:var(--bg)}
.seg button{padding:8px;border-radius:12px;font-size:14px;font-weight:800;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:6px;transition:.2s}
.seg button.on{background:var(--card);color:var(--ind);box-shadow:0 2px 10px rgba(0,0,0,.25)}
.card{border-radius:24px;background:var(--soft);padding:16px}.card h3{font-size:14px;font-weight:800;color:var(--mut);margin-bottom:10px}
.tg{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;text-align:left}.tg+.tg{border-top:1px solid var(--line)}
.tg b{display:block;font-size:14px}.tg small{display:block;font-size:12px;color:var(--mut)}
.sw{width:44px;height:24px;flex:none;border-radius:99px;padding:2px;background:#2c313c;transition:.25s}.sw i{display:block;width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s}.sw.on{background:var(--ind)}.sw.on i{transform:translateX(20px)}
.hint{font-size:12px;color:var(--mut);line-height:1.4}
/* анимации */
.ov.in{animation:fadein .28s both}.sheet.in{animation:up .45s cubic-bezier(.2,1,.3,1) both}
.ov.out{animation:fadeout .22s both}.sheet.out{animation:down .24s cubic-bezier(.5,0,.8,.4) both}
@keyframes fadein{from{opacity:0}}@keyframes fadeout{to{opacity:0}}
@keyframes up{from{transform:translateY(60px) scale(.96);opacity:0}}@keyframes down{to{transform:translateY(60px) scale(.96);opacity:0}}
.pane.open-in{animation:unfold .45s cubic-bezier(.2,.9,.25,1) both;transform-origin:50% 100%}
.pane.closing{animation:fold .3s cubic-bezier(.55,0,.8,.4) both;transform-origin:50% 100%;pointer-events:none}
@keyframes unfold{from{opacity:0;transform:translateY(8%) scale(.84);border-radius:44px}}
@keyframes fold{to{opacity:0;transform:translateY(10%) scale(.74);border-radius:44px;filter:blur(3px)}}
@media (max-width:760px){aside.list-in{animation:listin .45s cubic-bezier(.2,.9,.3,1) both}}
@keyframes listin{from{opacity:0;transform:scale(1.05)}}
.tabwrap{flex:1;display:flex;flex-direction:column;min-height:0}
.tab-r{animation:tabr .36s cubic-bezier(.2,.9,.3,1) both}.tab-l{animation:tabl .36s cubic-bezier(.2,.9,.3,1) both}
@keyframes tabr{from{opacity:0;transform:translateX(34px)}}@keyframes tabl{from{opacity:0;transform:translateX(-34px)}}
.stag .list>*{animation:rowin .5s cubic-bezier(.2,.9,.3,1) both}
.stag .list>*:nth-child(2){animation-delay:.04s}.stag .list>*:nth-child(3){animation-delay:.08s}.stag .list>*:nth-child(4){animation-delay:.12s}.stag .list>*:nth-child(5){animation-delay:.16s}.stag .list>*:nth-child(6){animation-delay:.2s}.stag .list>*:nth-child(7){animation-delay:.24s}.stag .list>*:nth-child(n+8){animation-delay:.28s}
@keyframes rowin{from{opacity:0;transform:translateY(16px)}}
.bump svg{animation:bump .55s cubic-bezier(.3,1.7,.5,1)}@keyframes bump{0%{transform:scale(.7)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.who{display:flex;align-items:center;gap:10px;text-align:left;border-radius:16px;padding:2px 10px 2px 2px}.who:hover{background:var(--soft)}
.ib.sm{width:36px;height:36px}
.pb2{display:inline-flex;vertical-align:-2px;margin-left:5px;color:#60a5fa;filter:drop-shadow(0 0 5px rgba(96,165,250,.6))}
.xbtn{position:absolute;top:12px;right:12px;z-index:2;background:rgba(0,0,0,.4)!important;color:#fff!important}
.ubn{margin:-20px -20px 0;height:128px;background-size:cover}.bn{background-size:220% 220%!important;animation:sh 10s ease-in-out infinite}
.uhead{display:flex;flex-direction:column;align-items:center;text-align:center;margin-top:-48px;gap:2px;padding-bottom:16px}
.uav{border-radius:50%;border:4px solid var(--card);animation:pop .5s .1s both}.uname{font-size:22px;font-weight:800;margin-top:6px}
.ubio{max-width:30ch;margin-top:8px;font-size:14px;overflow-wrap:anywhere}.mutd{color:var(--mut)}.ctr{text-align:center}
.shoprow{border-radius:24px!important;padding:14px 16px!important;gap:14px!important}
.shopic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#2563eb,#1e3a8a);color:#fff;flex:none}
.plus-hero{position:relative;overflow:hidden;border-radius:26px;padding:24px 18px;text-align:center;color:#fff;background:linear-gradient(135deg,#0b1e4a,#1e3a8a 60%,#081433);box-shadow:0 14px 40px rgba(30,58,138,.45)}
.plus-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.16) 50%,transparent 65%);transform:translateX(-100%);animation:sheen 4.5s ease-in-out infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.plus-hero h3{font-size:26px;font-weight:800}.plus-hero p{opacity:.8;font-size:14px}
.crown{width:68px;height:68px;margin:0 auto 10px;border-radius:22px;display:grid;place-items:center;background:rgba(255,255,255,.14);animation:flo 4s ease-in-out infinite}
@keyframes flo{50%{transform:translateY(-5px) rotate(-3deg)}}
.price{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:99px;background:rgba(255,255,255,.16);font-weight:800;font-size:14px}
.perk{display:flex;gap:12px;align-items:center;padding:10px 2px}.perk .pi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(59,130,246,.16);color:var(--ind);flex:none}
.perk b{display:block}.perk small{color:var(--mut);font-size:13px}.perk.soon{opacity:.55}
.act{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px;border-radius:16px;font-weight:800;color:#4ade80;background:rgba(74,222,128,.1);margin-bottom:10px}
.pbox{border-radius:20px;padding:14px;background:var(--soft);display:flex;flex-direction:column;gap:10px}
.lbl{font-size:12px;font-weight:800;color:var(--mut)}.sws{display:flex;gap:8px;flex-wrap:wrap}.sws button{width:30px;height:30px;border-radius:50%}.sws.bw button{width:46px;border-radius:10px}.sws .on{box-shadow:0 0 0 2px var(--soft),0 0 0 4px var(--ind)}
.bnprev{height:64px;border-radius:16px;background-size:cover}
.tray{padding:12px 14px;border-top:1px solid var(--line);background:var(--card);max-height:230px;overflow:auto}
.tray.in{animation:trayin .32s cubic-bezier(.2,.9,.3,1)}@keyframes trayin{from{opacity:0;transform:translateY(16px)}}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.stk{position:relative;aspect-ratio:1;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.stk button{width:100%;height:100%;padding:6px}.stk img{width:100%;height:100%;object-fit:contain}
.stk .x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;display:grid;place-items:center;cursor:pointer}
.stk.add{color:var(--ind);border:2px dashed var(--line);background:none;width:100%}
.lock{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:10px 0;color:var(--ind)}.lock b{color:var(--tx)}
.m.st,.m.out.st{background:none;box-shadow:none;padding:0}.m.st img{width:132px;height:132px;object-fit:contain;display:block}.m.st i{color:var(--mut)}.m.st .tk{color:var(--mut)}.m.st .tk.rd{color:#4ade80}
/* обычный фон регистрации */
.aurora{background:transparent!important;animation:none!important}
.glass{background:var(--card)!important;backdrop-filter:none!important;border:1px solid var(--line)!important;box-shadow:0 20px 50px rgba(0,0,0,.25)!important;color:var(--tx)!important}
/* файлы и фото */
.m.ph{padding:4px 4px 6px;max-width:min(300px,78%)}.pimg{display:block;width:100%;border-radius:14px;cursor:zoom-in;background:var(--soft);object-fit:cover}.pimg:not([src]){visibility:hidden}.m.ph i{padding:0 6px}
.fcard{display:flex;align-items:center;gap:10px;text-align:left;min-width:210px;max-width:100%;color:inherit}
.fi{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.18);flex:none}.m.in .fi{background:rgba(59,130,246,.16);color:var(--ind)}
.fn{min-width:0;flex:1}.fn b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fn small{opacity:.75;font-size:12px}.fd{opacity:.85}
.sysm{align-self:center;display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:99px;background:var(--soft);color:var(--mut);font-size:13px;font-weight:700}.sysm.fresh{animation:pop .3s both}.sysm time{opacity:.7;font-weight:600}

/* ---------- звонки (WebRTC; сигналы идут между вкладками этого браузера) ---------- */
let CALL=null,ringT=null,callT=null;
const RTC={iceServers:[{urls:'stun:stun.l.google.com:19302'}]};
const sig=m=>{try{localStorage.setItem('gh7sig',JSON.stringify({...m,from:meId(),r:Math.random()}))}catch{}};
const fmt=ms=>{const t=Math.floor(ms/1000);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')};
function ring(on){clearInterval(ringT);ringT=null;if(on&&cfg.sound){beep();ringT=setInterval(()=>{beep();setTimeout(beep,260)},1800)}}
const mkCall=(id,peer,role,status,video)=>({id,peer,role,status,video:!!video,min:false,mic:true,cam:false,scr:false,rem:{cam:false,scr:false,mic:true},q:[],pc:null,T:null,L:{aud:null,cam:null,scr:null},t0:0,lvT:null});
async function startCall(uid,video){
  if(CALL)return toast('Уже идёт звонок','Сначала завершите текущий');
  if(!usr(uid))return;
  CALL=mkCall('c'+Date.now()+Math.floor(Math.random()*999),uid,'caller','ringing',video);
  CALL.min=!video;
  const c=CALL;callOpen();await getMedia(video);
  if(CALL!==c)return;
  sig({t:'invite',to:uid,id:c.id,video:!!video});
  c.to=setTimeout(()=>{if(CALL===c&&c.status==='ringing')endCall('noans',true)},40000);
  ring(true);
}
async function getMedia(video){
  const c=CALL;if(!c)return;
  try{const st=await navigator.mediaDevices.getUserMedia({audio:true});c.L.aud=st.getAudioTracks()[0]}catch{c.mic=false;toast('Нет доступа к микрофону','Разрешите микрофон в браузере: пока вас не слышно')}
  if(video){try{const st=await navigator.mediaDevices.getUserMedia({video:{width:{ideal:1280},height:{ideal:720}}});c.L.cam=st.getVideoTracks()[0];c.cam=true}catch{toast('Нет доступа к камере','Звонок продолжится без видео')}}
  callUpdate();
}
async function acceptCall(){
  const c=CALL;if(!c||c.status!=='incoming')return;
  ring(false);clearTimeout(c.to);c.status='connecting';c.min=!c.video;callUpdate();
  await getMedia(c.video);if(CALL!==c)return;
  sig({t:'accept',to:c.peer,id:c.id});sig({t:'taken',to:meId(),id:c.id});
}
function declineCall(){const c=CALL;if(!c)return;sig({t:'decline',to:c.peer,id:c.id});endCall('x',false)}
function newPC(){
  const c=CALL,pc=new RTCPeerConnection(RTC);
  pc.onicecandidate=e=>{if(e.candidate)sig({t:'ice',to:c.peer,id:c.id,c:e.candidate.toJSON()})};
  pc.ontrack=e=>{const i=pc.getTransceivers().indexOf(e.transceiver),st=new MediaStream([e.track]);
    if(i===0){const a=$('#ra');if(a){a.srcObject=st;a.play().catch(()=>{})}}else{const v=$(i===1?'#rcam':'#rscr');if(v){v.srcObject=st;v.play().catch(()=>{})}}callUpdate()};
  pc.onconnectionstatechange=()=>{if(CALL!==c)return;const st=pc.connectionState;if(st==='connected'&&c.status!=='live'){c.status='live';c.t0=Date.now();ring(false);callUpdate();sendState()}else if(st==='failed'){toast('Связь потеряна','Не удалось соединиться');endCall('fail',true)}};
  return pc;
}
async function attach(){
  const c=CALL;if(!c||!c.T)return;const [ta,tc,ts]=c.T;
  if(c.L.aud)c.L.aud.enabled=c.mic;
  try{await ta.sender.replaceTrack(c.L.aud||null);await tc.sender.replaceTrack(c.cam?c.L.cam:null);await ts.sender.replaceTrack(c.scr?c.L.scr:null)}catch{}
}
async function makeOffer(){
  const c=CALL;if(!c)return;ring(false);clearTimeout(c.to);c.status='connecting';callUpdate();
  try{
    const pc=newPC();c.pc=pc;
    c.T=[pc.addTransceiver('audio',{direction:'sendrecv'}),pc.addTransceiver('video',{direction:'sendrecv'}),pc.addTransceiver('video',{direction:'sendrecv'})];
    await attach();const o=await pc.createOffer();await pc.setLocalDescription(o);
    sig({t:'offer',to:c.peer,id:c.id,sdp:{type:o.type,sdp:o.sdp}});
  }catch{toast('Звонок не удался','Браузер не поддерживает звонки');endCall('fail',true)}
}
async function onOffer(m){
  const c=CALL;if(!c)return;
  try{
    const pc=newPC();c.pc=pc;await pc.setRemoteDescription(m.sdp);
    c.T=pc.getTransceivers().slice(0,3);c.T.forEach(t=>{try{t.direction='sendrecv'}catch{}});
    await attach();await flushQ();const a=await pc.createAnswer();await pc.setLocalDescription(a);
    sig({t:'answer',to:c.peer,id:c.id,sdp:{type:a.type,sdp:a.sdp}});
  }catch{toast('Звонок не удался','Браузер не поддерживает звонки');endCall('fail',true)}
}
async function flushQ(){const c=CALL;if(!c||!c.pc)return;for(const x of c.q.splice(0))await c.pc.addIceCandidate(x).catch(()=>{})}
function sendState(){const c=CALL;if(c)sig({t:'st',to:c.peer,id:c.id,cam:c.cam,scr:c.scr,mic:c.mic})}
function toggleMic(){const c=CALL;if(!c)return;if(!c.L.aud)return toast('Нет микрофона','Разрешите доступ к микрофону в браузере');c.mic=!c.mic;c.L.aud.enabled=c.mic;callUpdate();sendState()}
async function toggleCam(){
  const c=CALL;if(!c)return;
  if(c.cam){c.cam=false;try{c.L.cam&&c.L.cam.stop()}catch{}c.L.cam=null;await attach()}
  else{try{const st=await navigator.mediaDevices.getUserMedia({video:true});c.L.cam=st.getVideoTracks()[0];c.cam=true;await attach()}catch{toast('Нет доступа к камере','Разрешите камеру в браузере')}}
  callUpdate();sendState();
}
async function toggleScr(){
  const c=CALL;if(!c)return;
  if(c.scr)return stopScr();
  if(!c.T)return toast('Подождите','Демонстрация экрана доступна после соединения');
  try{const st=await navigator.mediaDevices.getDisplayMedia({video:true});const t=st.getVideoTracks()[0];t.onended=stopScr;c.L.scr=t;c.scr=true;await attach();callUpdate();sendState()}
  catch{toast('Демонстрация недоступна','Браузер или окно не разрешили показ экрана')}
}
function stopScr(){const c=CALL;if(!c||!c.scr)return;c.scr=false;try{c.L.scr&&c.L.scr.stop()}catch{}c.L.scr=null;attach();callUpdate();sendState()}
function callLog(c,reason){
  const dur=c.t0?Date.now()-c.t0:0,base=c.video?'Видеозвонок':'Звонок';
  const t=dur?base+' · '+fmt(dur):reason==='declined'?base+' отклонён':reason==='busy'?'Собеседник занят':'Пропущенный '+(c.video?'видеозвонок':'звонок');
  mut(()=>{const ch=D.c.find(x=>x.type==='dm'&&x.m.includes(meId())&&x.m.includes(c.peer));if(ch)D.m.push({id:D.n++,cid:ch.id,from:meId(),k:'call',t,ts:Date.now(),st:'read'})});
}
function endCall(reason,send){
  const c=CALL;if(!c)return;CALL=null;
  clearTimeout(c.to);clearInterval(callT);ring(false);
  if(send)sig({t:'end',to:c.peer,id:c.id});
  try{c.pc&&c.pc.close()}catch{}
  [c.L.aud,c.L.cam,c.L.scr].forEach(t=>{try{t&&t.stop()}catch{}});
  $('#call').innerHTML='';document.body.classList.remove('callmin');
  if(c.role==='caller')callLog(c,reason);else draw();
}
function onSig(m){
  if(!meId()||m.to!==meId())return;
  const c=CALL;
  if(m.t==='invite'){
    if(c){sig({t:'busy',to:m.from,id:m.id});return}
    CALL=mkCall(m.id,m.from,'callee','incoming',m.video);callOpen();ring(true);
    const cc=CALL;cc.to=setTimeout(()=>{if(CALL===cc&&cc.status==='incoming')endCall('noans',false)},45000);return;
  }
  if(!c||c.id!==m.id)return;
  if(m.t==='accept'&&c.role==='caller')makeOffer();
  else if(m.t==='offer')onOffer(m);
  else if(m.t==='answer'&&c.pc)c.pc.setRemoteDescription(m.sdp).then(flushQ).catch(()=>{});
  else if(m.t==='ice'){if(c.pc&&c.pc.remoteDescription)c.pc.addIceCandidate(m.c).catch(()=>{});else c.q.push(m.c)}
  else if(m.t==='st'){c.rem={cam:!!m.cam,scr:!!m.scr,mic:m.mic!==false};callUpdate()}
  else if(m.t==='decline')endCall('declined',false);
  else if(m.t==='busy')endCall('busy',false);
  else if(m.t==='end')endCall('remote',false);
  else if(m.t==='taken'&&c.status==='incoming')endCall('x',false);
}
function callOpen(){
  const c=CALL,p=usr(c.peer);if(!p)return;
  $('#call').innerHTML=`<div class="call" id="callc"><div class="cstage"><div class="vwrap"><video id="rscr" class="rv" autoplay playsinline></video><video id="rcam" class="rv" autoplay playsinline></video><div class="rav" id="rav"><div class="ring">${av(p,128)}</div><div class="cname">${esc(full(p))}</div></div></div><div class="cpip" id="cpip"><video id="lv" autoplay muted playsinline></video></div><div class="ctop"><div><div class="cn2">${esc(full(p))}</div><div class="cs" id="cst"></div></div><button class="cb sm" data-a="cmin" aria-label="Свернуть">${ic('chevronDown',22)}</button></div><div class="cctl"><button class="cb" id="bmic" data-a="cmic" aria-label="Микрофон"></button><button class="cb" id="bcam" data-a="ccam" aria-label="Камера"></button><button class="cb" id="bscr" data-a="cscr" aria-label="Демонстрация экрана"></button><button class="cb red" data-a="cend" aria-label="Завершить">${ic('phoneOff',26)}</button></div><div class="cinc"><button class="cb red big" data-a="cdec" aria-label="Отклонить">${ic('phoneOff',28)}</button><button class="cb green big" data-a="cacc" aria-label="Принять">${ic('phone',28)}</button></div></div><div class="cbar" data-a="cmax" role="button" aria-label="Развернуть звонок"><span class="cav">${av(p,42)}<i class="live"></i></span><div class="cbt"><b>Звонок с ${esc(full(p))}</b><small id="cbt"></small></div><button class="ib" id="bmic2" data-a="cmic" aria-label="Микрофон"></button><button class="ib end" data-a="cend" aria-label="Завершить">${ic('phoneOff',20)}</button></div><audio id="ra" autoplay></audio></div>`;
  clearInterval(callT);callT=setInterval(callUpdate,1000);callUpdate();
}
function callUpdate(){
  const c=CALL,root=$('#callc');if(!c||!root)return;
  const mn=c.min&&c.status!=='incoming';
  root.classList.toggle('min',mn);document.body.classList.toggle('callmin',mn);root.classList.toggle('inc',c.status==='incoming');
  let st=c.status==='incoming'?(c.video?'Входящий видеозвонок':'Входящий звонок'):c.status==='ringing'?'Вызываем…':c.status==='connecting'?'Соединяем…':fmt(Date.now()-c.t0);
  if(c.status==='live'&&c.rem.mic===false)st+=' · собеседник без звука';
  $('#cst').textContent=st;$('#cbt').textContent=c.status==='live'?'Идёт звонок · '+st:st;
  const set=(id,on,icn,offIcn)=>{const b=$(id);if(!b)return;b.innerHTML=ic(on?icn:offIcn,id==='#bmic2'?20:24);b.classList.toggle('off',!on)};
  set('#bmic',c.mic,'mic','micOff');set('#bmic2',c.mic,'mic','micOff');set('#bcam',c.cam,'video','videoOff');
  const bs=$('#bscr');if(bs){bs.innerHTML=ic('screen',24);bs.classList.toggle('off',c.scr)}
  const rs=$('#rscr'),rc=$('#rcam');
  rs.style.display=c.rem.scr?'block':'none';rc.style.display=c.rem.cam?'block':'none';rc.classList.toggle('mini',!!(c.rem.scr&&c.rem.cam));
  $('#rav').style.display=(c.rem.scr||c.rem.cam)?'none':'flex';
  const lt=c.scr?c.L.scr:(c.cam?c.L.cam:null),lv=$('#lv'),pip=$('#cpip');
  if(lt){if(c.lvT!==lt){c.lvT=lt;lv.srcObject=new MediaStream([lt])}}else{c.lvT=null;lv.srcObject=null}
  pip.style.display=lt?'block':'none';pip.classList.toggle('scr',!!c.scr);
}
window.addEventListener('beforeunload',()=>{if(CALL)sig({t:'end',to:CALL.peer,id:CALL.id})});

/* ---------- live updates (2nd tab / window) ---------- */
function tick(){
  if(!meId())return;
  D=load();let ch=false;
  const mine=myChats();
  D.m.forEach(m=>{
    const c=mine.find(c=>c.id===m.cid);if(!c||m.from===meId())return;
    if(ui.chat===c.id&&document.visibilityState==='visible'){if(m.st!=='read'){m.st='read';ch=true}}
    else if(m.st==='sent'){m.st='delivered';ch=true}
  });
  if(ch)save();
  // уведомления
  const u=me();if(!u)return;banPoll();plusPoll();devPoll();cloudSync();
  if(sessionStorage.ghT&&!ui.sheet){const th=decodeTheme(sessionStorage.ghT);sessionStorage.removeItem('ghT');if(th){ui.timp=th;ui.sheet='timp';ui.fx={sheet:1};draw()}}
  mine.forEach(c=>{const ms=cmsgs(c.id),l=ms[ms.length-1];if(!l)return;const prev=seen[c.id]??0;
    if(inited&&l.id>prev&&l.from!==meId()&&ui.chat!==c.id&&Date.now()-l.ts<180000){const o=usr(l.from);if(cfg.on){toast(isGrp(c)?c.name+(o?' · '+o.first:''):(o?full(o):'Новое сообщение'),cfg.preview?l.t:'Новое сообщение',false,c.id);if(cfg.sound)beep()}}
    seen[c.id]=Math.max(prev,l.id)});
  incoming().forEach(x=>{if(inited&&!seenReq.has(x.fid)){if(cfg.on){toast('Заявка в друзья',`${full(x.u)} (@${x.u.un}) хочет дружить`);if(cfg.sound)beep()}}seenReq.add(x.fid)});
  D.s.forEach(x=>{
    const p=seenS[x.id];
    if(!p){if(inited&&x.uid!==meId()&&Date.now()-x.ts<6e5&&cfg.on&&(x.feed||friends().some(f=>f.u.id===x.uid))){const u=usr(x.uid);if(u){toast('Новая история',full(u)+(x.feed?' выложил(а) в ленту':' опубликовал(а) историю'));if(cfg.sound)beep()}}}
    else if(x.uid===meId()&&inited&&cfg.on){
      if(x.likes.length>p.l){const u=usr(x.likes[x.likes.length-1]);if(u&&u.id!==meId()){toast(full(u),'оценил(а) вашу историю');if(cfg.sound)beep()}}
      if(x.cm.length>p.c){const c=x.cm[x.cm.length-1],u=usr(c.uid);if(u&&u.id!==meId()){toast(full(u),cfg.preview?'прокомментировал(а): '+c.t:'прокомментировал(а) вашу историю');if(cfg.sound)beep()}}
    }
    seenS[x.id]={l:x.likes.length,c:x.cm.length};
  });
  inited=true;
  const raw=localStorage.gh7;if(raw!==lastRaw){lastRaw=raw;draw()}
}
window.addEventListener('storage',e=>{if(e.key==='gh7')tick();else if(e.key==='gh7sig'&&e.newValue){try{onSig(JSON.parse(e.newValue))}catch{}}});
setInterval(()=>{if(document.visibilityState==='visible')tick()},1200);setInterval(()=>{if(document.visibilityState!=='visible')cloudSync(true)},15000);
draw();tick();cloudPush();
</script>

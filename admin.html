<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>GoodHi — админ-панель</title>
<style>
:root{--bg:#0c0e12;--card:#13161c;--soft:#1a1e26;--tx:#e9ecf2;--mut:#7e8696;--ind:#3b82f6;--line:#242831;--red:#f43f5e;--ok:#10b981;color-scheme:dark}
@media(prefers-color-scheme:light){:root{--bg:#ececf0;--card:#f6f6f9;--soft:#e4e6eb;--tx:#14171c;--mut:#667085;--ind:#2563eb;--line:#d6d9e0;color-scheme:light}}
*{box-sizing:border-box;margin:0}
body{font:15px/1.4 "Nunito","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:980px;margin:0 auto;padding:18px 16px 60px}
header{display:flex;align-items:center;gap:12px;margin-bottom:16px;flex-wrap:wrap}
header h1{font-size:22px;font-weight:800;flex:1}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.stat b{display:block;font-size:24px}.stat span{color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
.tabs button{padding:9px 16px;border-radius:999px;background:var(--soft);font-weight:700;white-space:nowrap}
.tabs button.on{background:var(--ind);color:#fff}
.tabs i{font-style:normal;background:var(--red);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;margin-left:6px}
.inp{width:100%;border:1px solid var(--line);outline:0;background:var(--soft);border-radius:14px;padding:11px 14px;margin-bottom:12px}
.inp:focus{border-color:var(--ind)}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.who{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0;overflow-wrap:anywhere}
.av{flex:none;border-radius:50%;overflow:hidden;display:grid;place-items:center;color:#fff;font-weight:800;background:linear-gradient(135deg,#3b82f6,#1e40af)}
.av img{width:100%;height:100%;object-fit:cover}
.mut{color:var(--mut)}.sm{font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:var(--soft);margin-left:6px}
.tag.red{background:rgba(244,63,94,.16);color:var(--red)}.tag.ok{background:rgba(16,185,129,.16);color:var(--ok)}.tag.pl{background:rgba(59,130,246,.18);color:var(--ind)}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.rtext{background:var(--soft);border-radius:12px;padding:10px 12px;margin:10px 0;overflow-wrap:anywhere}
.btns{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn{padding:10px 18px;border-radius:12px;font-weight:800;background:var(--soft)}
.btn.danger{background:var(--red);color:#fff}.btn.pri{background:var(--ind);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.stc{border-radius:12px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.stp{aspect-ratio:1;display:grid;place-items:center;text-align:center;padding:12px;color:#fff;font-weight:800;overflow-wrap:anywhere}
.stp img{width:100%;height:100%;object-fit:cover;display:block}
.stb{padding:10px 12px}
.empty{text-align:center;color:var(--mut);padding:50px 10px}.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:4px}
.login{max-width:360px;margin:12vh auto 0}.login h1{font-size:26px;margin-bottom:6px}.login p{color:var(--mut);margin-bottom:18px}
.err{color:var(--red);font-size:14px;margin:6px 0 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.on{opacity:1}
code{background:var(--soft);padding:1px 6px;border-radius:6px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<div id="toast"></div>
<script src="config.js"></script>
<script>
const C=window.GH_CFG||{},DB=/YOUR-/.test(C.dbUrl||'')?'':String(C.dbUrl||'').replace(/\/$/,''),KEY=/YOUR_/.test(C.apiKey||'')?'':(C.apiKey||'');
const $=s=>document.querySelector(s),enc=encodeURIComponent;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ts=>ts?new Date(ts).toLocaleString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}):'—';
const nm=u=>u?((u.first||'')+' '+(u.last||'')).trim()||'—':'—';
const ini=n=>String(n).split(' ').filter(Boolean).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?';
const okImg=s=>typeof s==='string'&&s.startsWith('data:image/');
const BG=['#2563eb','#0d9488','#e11d48','#d97706','#0ea5e9','#4338ca','#7c3aed','#be123c'];
let tok=null,exp=0,tab='reports',q='',data={users:{},stories:{},chats:{},reports:{},bans:{}},loginErr='',timer=null;

/* ---------- Firebase Auth (REST) ---------- */
async function signIn(email,pw){
  const r=await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key=${KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password:pw,returnSecureToken:true})});
  const j=await r.json();if(!r.ok)throw new Error(j.error&&j.error.message||'error');
  tok=j.idToken;exp=Date.now()+(+j.expiresIn-120)*1000;sessionStorage.ghr=j.refreshToken;
}
async function token(){
  if(tok&&Date.now()<exp)return tok;
  const rt=sessionStorage.ghr;if(!rt)throw new Error('session');
  const r=await fetch(`https://securetoken.googleapis.com/v1/token?key=${KEY}`,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:'grant_type=refresh_token&refresh_token='+enc(rt)});
  const j=await r.json();if(!r.ok){delete sessionStorage.ghr;tok=null;throw new Error('session')}
  tok=j.id_token;exp=Date.now()+(+j.expires_in-120)*1000;sessionStorage.ghr=j.refresh_token;return tok;
}
async function api(path,method='GET',body){
  const t=await token();
  const r=await fetch(`${DB}/${path.split('/').map(enc).join('/')}.json?auth=${t}`,{method,body:body===undefined?undefined:JSON.stringify(body)});
  if(r.status===401||r.status===403)throw new Error('Нет доступа. Проверьте правила базы и почту админа в них.');
  if(!r.ok)throw new Error('Ошибка базы: '+r.status);
  return r.json();
}
async function loadAll(){
  const names=['users','stories','chats','reports','bans'];
  const res=await Promise.all(names.map(n=>api(n)));
  names.forEach((n,i)=>data[n]=res[i]||{});
}

/* ---------- UI ---------- */
let tt;function toast(m){const e=$('#toast');e.textContent=m;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2800)}
const av=(u,s=42,fallback='')=>`<div class="av" style="width:${s}px;height:${s}px;font-size:${s*.38}px">${u&&okImg(u.photo)?`<img src="${esc(u.photo)}" alt="">`:esc(ini(u?nm(u):fallback))}</div>`;
const empty=(a,b)=>`<div class="empty"><b>${a}</b>${b}</div>`;

function root(){
  const el=$('#root');
  if(!DB||!KEY){el.innerHTML=`<div class="login"><h1>Нужна настройка</h1><p>Откройте <code>config.js</code> и впишите <code>dbUrl</code> и <code>apiKey</code> вашего проекта Firebase. Подробности — в README.md.</p></div>`;return}
  if(!sessionStorage.ghr){
    el.innerHTML=`<div class="login"><h1>GoodHi · админ</h1><p>Войдите аккаунтом администратора.</p>
    <input class="inp" id="em" type="email" placeholder="Почта" autocomplete="username" value="${esc(localStorage.ghAdm||'')}">
    <input class="inp" id="pw" type="password" placeholder="Пароль" autocomplete="current-password">
    ${loginErr?`<div class="err">${esc(loginErr)}</div>`:''}
    <button class="btn pri" style="width:100%" data-a="login">Войти</button></div>`;return}
  el.innerHTML=`<header><h1>GoodHi · админ-панель</h1><button class="btn" data-a="refresh">Обновить</button><button class="btn" data-a="logout">Выйти</button></header>
  <div class="stats" id="stats"></div><div class="tabs" id="tabs"></div><div id="sw"></div><div id="view"></div>`;
  paint();
}
function paint(){
  if(!$('#view'))return;
  const nrep=Object.keys(data.reports).length;
  $('#stats').innerHTML=[['Пользователей',Object.keys(data.users).length],['Историй',Object.keys(data.stories).length],['Чатов',Object.keys(data.chats).length],['Жалоб',nrep],['В бане',Object.keys(data.bans).length]].map(([l,n])=>`<div class="stat"><b>${n}</b><span>${l}</span></div>`).join('');
  $('#tabs').innerHTML=[['reports','Жалобы'],['users','Пользователи'],['stories','Истории'],['chats','Чаты и группы']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}${k==='reports'&&nrep?`<i>${nrep}</i>`:''}</button>`).join('');
  const sw=$('#sw'),had=document.getElementById('q');
  if(tab==='users'){if(!had)sw.innerHTML=`<input class="inp" id="q" placeholder="Поиск: имя, @юзернейм или почта" value="${esc(q)}">`}else sw.innerHTML='';
  $('#view').innerHTML={reports:vReports,users:vUsers,stories:vStories,chats:vChats}[tab]();
}
function vReports(){
  const arr=Object.entries(data.reports).map(([id,r])=>({id,...r})).sort((a,b)=>b.ts-a.ts);
  if(!arr.length)return empty('Жалоб нет','Пока всё спокойно.');
  const cnt={};arr.forEach(r=>cnt[r.target]=(cnt[r.target]||0)+1);
  return arr.map(r=>{const u=data.users[r.target],banned=!!data.bans[r.target];
    return `<div class="card"><div class="rhead"><span><span class="tag red" style="margin:0">${esc(r.reason)}</span></span><span class="mut sm">${fmt(r.ts)}</span></div>
    <div class="who">${av(u,46,r.targetName)}<div class="grow"><b>${esc(r.targetName||nm(u))}</b> <span class="mut">@${esc(r.targetUn||(u&&u.un))}</span>${banned?'<span class="tag red">в бане</span>':''}<div class="mut sm">${esc((u&&u.email)||r.target)} · жалоб на пользователя: ${cnt[r.target]}</div></div></div>
    ${r.text?`<div class="rtext">${esc(r.text)}</div>`:''}
    <div class="mut sm" style="margin-top:8px">Пожаловался: @${esc(r.fromUn)}</div>
    <div class="btns"><button class="btn danger" data-a="ban" data-k="${esc(r.target)}" ${banned?'disabled':''}>Забанить</button><button class="btn" data-a="dismiss" data-id="${esc(r.id)}">Удалить жалобу</button></div></div>`}).join('');
}
function vUsers(){
  const s=q.trim().toLowerCase().replace(/^@/,'');
  const arr=Object.entries(data.users).map(([k,u])=>({k,...u})).filter(u=>!s||(nm(u)+' '+u.un+' '+u.email).toLowerCase().includes(s)).sort((a,b)=>(b.ts||0)-(a.ts||0));
  if(!arr.length)return empty('Никого не найдено','');
  return arr.map(u=>{const banned=!!data.bans[u.k],n=Object.values(data.reports).filter(r=>r.target===u.k).length;
    return `<div class="card who">${av(u,46)}<div class="grow"><b>${esc(nm(u))}</b> <span class="mut">@${esc(u.un)}</span>${u.plus?'<span class="tag pl">Plus</span>':''}${banned?'<span class="tag red">в бане</span>':''}${n?`<span class="tag red">жалоб: ${n}</span>`:''}
    <div class="mut sm">${esc(u.email)} · регистрация: ${fmt(u.ts)}</div>${u.bio?`<div class="sm" style="margin-top:4px">${esc(u.bio)}</div>`:''}</div>
    ${banned?`<button class="btn" data-a="unban" data-k="${esc(u.k)}">Разбанить</button>`:`<button class="btn danger" data-a="ban" data-k="${esc(u.k)}">Забанить</button>`}</div>`}).join('');
}
function vStories(){
  const arr=Object.entries(data.stories).map(([k,s])=>({k,...s})).sort((a,b)=>b.ts-a.ts);
  if(!arr.length)return empty('Историй нет','');
  return `<div class="grid">${arr.map(s=>{const u=data.users[s.u];
    const pic=okImg(s.th)?`<img src="${esc(s.th)}" alt="">`:esc(s.text||'');
    return `<div class="stc"><div class="stp" style="background:${BG[(s.bg||0)%BG.length]}">${pic}</div><div class="stb"><b>${esc(nm(u))}</b> <span class="mut sm">@${esc(u&&u.un)}</span>
    ${s.cap?`<div class="sm">${esc(s.cap)}</div>`:''}<div class="mut sm">${fmt(s.ts)}</div><div class="sm">${s.feed?'<span class="tag ok" style="margin:0">в ленте</span> ':''}♥ ${s.likes||0} · 💬 ${s.cm||0}</div></div></div>`}).join('')}</div>`;
}
function vChats(){
  const arr=Object.entries(data.chats).map(([k,c])=>({k,...c})).sort((a,b)=>(b.last||0)-(a.last||0));
  if(!arr.length)return empty('Чатов нет','');
  const type={dm:'Личный чат',saved:'Избранное'};
  return arr.map(c=>`<div class="card"><b>${esc(type[c.type]||'Группа')}</b> <span class="tag">${c.members?c.members.length:0} уч.</span> <span class="tag">${c.n||0} сообщ.</span>
    <div class="sm" style="margin-top:6px">${(c.members||[]).map(k=>{const u=data.users[k];return esc(u?nm(u)+' (@'+u.un+')':k)}).join(' · ')}</div>
    <div class="mut sm">Последнее сообщение: ${fmt(c.last)}</div></div>`).join('');
}

/* ---------- действия ---------- */
async function run(fn,ok){
  try{await fn();await loadAll();paint();if(ok)toast(ok)}
  catch(e){if(e.message==='session'){root();return}toast(e.message)}
}
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]');if(!el)return;const a=el.dataset.a;
  if(a==='login'){
    const em=$('#em').value.trim(),pw=$('#pw').value;if(!em||!pw)return;
    try{await signIn(em,pw);localStorage.ghAdm=em;loginErr='';root();await loadAll();paint();startTimer()}
    catch(err){loginErr='Не удалось войти: '+(String(err.message).includes('INVALID')||String(err.message).includes('EMAIL')?'неверная почта или пароль.':err.message);root()}
  }
  else if(a==='logout'){delete sessionStorage.ghr;tok=null;clearInterval(timer);root()}
  else if(a==='refresh')run(()=>0,'Обновлено');
  else if(a==='tab'){tab=el.dataset.v;paint()}
  else if(a==='dismiss')run(()=>api('reports/'+el.dataset.id,'DELETE'),'Жалоба удалена');
  else if(a==='unban')run(()=>api('bans/'+el.dataset.k,'DELETE'),'Пользователь разбанен');
  else if(a==='ban'){
    const k=el.dataset.k,u=data.users[k];
    if(!confirm('Забанить '+(u?nm(u)+' (@'+u.un+')':k)+'?\nОн не сможет войти, а текущий сеанс завершится. Все жалобы на него будут удалены.'))return;
    run(async()=>{
      await api('bans/'+k,'PUT',true);
      for(const [id,r] of Object.entries(data.reports))if(r.target===k)await api('reports/'+id,'DELETE');
    },'Пользователь забанен, жалобы закрыты');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;$('#view').innerHTML=vUsers()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='pw'||e.target.id==='em'))document.querySelector('[data-a=login]').click()});
function startTimer(){clearInterval(timer);timer=setInterval(()=>{if(document.visibilityState==='visible'&&sessionStorage.ghr&&!document.activeElement.matches('input'))loadAll().then(paint).catch(()=>{})},20000)}

root();
if(DB&&KEY&&sessionStorage.ghr)loadAll().then(()=>{paint();startTimer()}).catch(e=>{if(e.message==='session')root();else toast(e.message)});
</script>
</body>
</html>
